<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <marker id="arrow-commit" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <linearGradient id="gcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14263B"/>
      <stop offset="100%" stop-color="#0D1826"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="360" fill="#131B2B"/>

  <rect x="20" y="15" width="1060" height="330" rx="10" fill="url(#gcGrad)" stroke="#233A5E" stroke-width="1.5"/>
  <rect x="35" y="10" width="560" height="24" rx="4" fill="#1A2D4A" stroke="#38BDF8" stroke-width="1"/>
  <text x="45" y="26" fill="#38BDF8" font-family="Arial" font-size="11.5" font-weight="bold">DYNAMIC GROUP COMMIT: AMORTIZING HARDWARE FSYNC ACROSS N WRITERS</text>

  <!-- Concurrent Writers on Left -->
  <g transform="translate(35, 50)">
    <text x="0" y="18" fill="#94A3B8" font-family="Arial" font-size="10.5" font-weight="bold">CONCURRENT PUBLISHERS</text>

    <!-- Writer 1 -->
    <rect y="30" width="180" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="12" y="48" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="bold">Publisher 1</text>
    <text x="12" y="63" fill="#94A3B8" font-family="monospace" font-size="9.5">PUB orders {"id":1}</text>

    <!-- Writer 2 -->
    <rect y="82" width="180" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="12" y="100" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="bold">Publisher 2</text>
    <text x="12" y="115" fill="#94A3B8" font-family="monospace" font-size="9.5">PUB orders {"id":2}</text>

    <!-- Writer 3 -->
    <rect y="134" width="180" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="12" y="152" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="bold">Publisher 3</text>
    <text x="12" y="167" fill="#94A3B8" font-family="monospace" font-size="9.5">PUB orders {"id":3}</text>

    <!-- Writer N -->
    <rect y="186" width="180" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="12" y="204" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="bold">Publisher N (Up to 50)</text>
    <text x="12" y="219" fill="#94A3B8" font-family="monospace" font-size="9.5">PUB orders {"id":N}</text>
  </g>

  <!-- Arrows from writers into Group Leader -->
  <path d="M 220 100 L 260 145" stroke="#38BDF8" stroke-width="1.5"/>
  <path d="M 220 152 L 260 152" stroke="#38BDF8" stroke-width="1.5"/>
  <path d="M 220 205 L 260 160" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Center-Left: Group Commit Coordinator -->
  <g transform="translate(265, 75)">
    <rect width="260" height="180" rx="8" fill="#16253B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="12" y="12" width="236" height="24" rx="4" fill="#0F3354"/>
    <text x="20" y="28" fill="#38BDF8" font-family="Arial" font-size="11" font-weight="bold">LEADER/FOLLOWER BARRIER</text>

    <text x="16" y="60" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="bold">• Leader Goroutine:</text>
    <text x="26" y="76" fill="#94A3B8" font-family="Arial" font-size="10">First writer acquires sync lock,</text>
    <text x="26" y="90" fill="#94A3B8" font-family="Arial" font-size="10">drains atomic queue in 1 shot.</text>

    <text x="16" y="115" fill="#FBBF24" font-family="Arial" font-size="11" font-weight="bold">• Follower Goroutines:</text>
    <text x="26" y="131" fill="#94A3B8" font-family="Arial" font-size="10">Park on completion channel (doneChan);</text>
    <text x="26" y="145" fill="#94A3B8" font-family="Arial" font-size="10">zero CPU burn while waiting.</text>

    <text x="16" y="168" fill="#34D399" font-family="Arial" font-size="10" font-weight="bold">Single physical I/O write for all N</text>
  </g>

  <!-- Arrow to Physical Storage -->
  <path d="M 530 165 L 575 165" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrow-commit)"/>

  <!-- Center-Right: NVMe Storage Subsystem -->
  <g transform="translate(580, 65)">
    <rect width="250" height="200" rx="8" fill="#0C251C" stroke="#34D399" stroke-width="2"/>
    <rect x="12" y="12" width="226" height="24" rx="4" fill="#133D2D"/>
    <text x="22" y="28" fill="#34D399" font-family="Arial" font-size="11" font-weight="bold">PHYSICAL NVMe STORAGE</text>

    <text x="16" y="60" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="bold">Direct Kernel Barrier</text>
    <rect x="12" y="70" width="226" height="32" rx="4" fill="#0B1A14" stroke="#34D399" stroke-width="1"/>
    <text x="20" y="90" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">f.Sync() / fsync()</text>

    <text x="16" y="124" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="bold">Sequential WAL Append:</text>
    <rect x="12" y="134" width="226" height="50" rx="4" fill="#143324"/>
    <text x="20" y="152" fill="#94A3B8" font-family="monospace" font-size="9.5">[#1 | 48B] [#2 | 52B] [#3 | 48B]</text>
    <text x="20" y="170" fill="#34D399" font-family="Arial" font-size="10" font-weight="bold">1 Hardware Sync = N Records</text>
  </g>

  <!-- Notification back to all writers -->
  <path d="M 700 270 L 700 295 L 125 295 L 125 285" stroke="#34D399" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <rect x="330" y="285" width="250" height="20" rx="4" fill="#0F2B20" stroke="#34D399" stroke-width="1"/>
  <text x="340" y="299" fill="#34D399" font-family="Arial" font-size="9.5" font-weight="bold">Simultaneous doneChan Broadcast (close)</text>

  <!-- Rightmost: Performance Outcome Card -->
  <g transform="translate(850, 65)">
    <rect width="210" height="200" rx="8" fill="#162235" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="10" y="10" width="190" height="22" rx="4" fill="#1F324D"/>
    <text x="18" y="25" fill="#38BDF8" font-family="Arial" font-size="10" font-weight="bold">BENCHMARK VERIFICATION</text>

    <text x="15" y="55" fill="#94A3B8" font-family="Arial" font-size="10">Individual fsync rate:</text>
    <text x="15" y="74" fill="#FCA5A5" font-family="Arial" font-size="12" font-weight="bold">~500 - 1,000 writes/s</text>

    <text x="15" y="102" fill="#94A3B8" font-family="Arial" font-size="10">PMB Group Commit rate:</text>
    <text x="15" y="125" fill="#34D399" font-family="Arial" font-size="18" font-weight="bold">30,000+ writes/s</text>

    <rect x="12" y="145" width="186" height="42" rx="4" fill="#0C1B2E"/>
    <text x="18" y="162" fill="#38BDF8" font-family="Arial" font-size="9" font-weight="bold">Durability Guarantee:</text>
    <text x="18" y="177" fill="#FFFFFF" font-family="Arial" font-size="8.5">Zero records lost on pull plug</text>
  </g>
</svg>