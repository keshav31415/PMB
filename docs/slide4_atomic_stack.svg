<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F87171"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24141E"/>
      <stop offset="100%" stop-color="#140A10"/>
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102520"/>
      <stop offset="100%" stop-color="#091714"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="360" fill="#131B2B"/>

  <!-- LEFT PANEL: Traditional Mutex Lock Convoy -->
  <g transform="translate(20, 15)">
    <rect width="520" height="330" rx="10" fill="url(#badGrad)" stroke="#F87171" stroke-width="1.5"/>
    <rect x="15" y="12" width="340" height="24" rx="4" fill="#4C1D24"/>
    <text x="25" y="28" fill="#FCA5A5" font-family="Arial" font-size="11.5" font-weight="bold">TRADITIONAL MUTEX CONTENTION (Lock Convoy)</text>

    <!-- 3 Producers trying to lock -->
    <g transform="translate(25, 55)">
      <rect width="120" height="42" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="15" y="26" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="bold">MicroVM 1</text>

      <rect y="60" width="120" height="42" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="15" y="86" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="bold">MicroVM 2</text>

      <rect y="120" width="120" height="42" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="15" y="146" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="bold">MicroVM 3</text>
    </g>

    <!-- Mutex Barrier Box -->
    <g transform="translate(180, 75)">
      <rect width="140" height="120" rx="8" fill="#38151D" stroke="#F87171" stroke-width="1.5"/>
      <text x="18" y="30" fill="#FCA5A5" font-family="Arial" font-size="11" font-weight="bold">OS Mutex Lock</text>
      <text x="18" y="52" fill="#FFFFFF" font-family="monospace" font-size="10">sync.Mutex.Lock()</text>
      <rect x="12" y="68" width="116" height="40" rx="4" fill="#58151C"/>
      <text x="18" y="86" fill="#FDE68A" font-family="Arial" font-size="9.5" font-weight="bold">LOCK CONVOY</text>
      <text x="18" y="100" fill="#FCA5A5" font-family="Arial" font-size="9">Threads sleep in kernel</text>
    </g>

    <!-- Connecting Arrows into Mutex -->
    <path d="M 145 76 L 175 105" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)"/>
    <path d="M 145 135 L 175 135" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)"/>
    <path d="M 145 196 L 175 165" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Bottleneck Output -->
    <path d="M 320 135 L 355 135" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)"/>
    <g transform="translate(360, 95)">
      <rect width="135" height="80" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="12" y="24" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="bold">Serialized Ingress</text>
      <text x="12" y="44" fill="#FCA5A5" font-family="Arial" font-size="9.5">Max ~8,000 ops/s</text>
      <text x="12" y="62" fill="#94A3B8" font-family="Arial" font-size="9">Severe tail latency</text>
    </g>

    <!-- Bottom summary box -->
    <rect x="20" y="235" width="480" height="80" rx="6" fill="#1A0D14" stroke="#4C1D24" stroke-width="1"/>
    <text x="32" y="258" fill="#FCA5A5" font-family="Arial" font-size="10" font-weight="bold">THE HYPERVISOR PENALTY: THREAD INVERSION</text>
    <text x="32" y="278" fill="#94A3B8" font-family="Arial" font-size="9.5">When hypervisor overcommits vCPUs, a descheduled lock-holding</text>
    <text x="32" y="295" fill="#94A3B8" font-family="Arial" font-size="9.5">thread blocks all other guest microVMs, multiplying tail latency 10x-50x.</text>
  </g>

  <!-- RIGHT PANEL: PMB Lock-Free Atomic Treiber Stack -->
  <g transform="translate(560, 15)">
    <rect width="520" height="330" rx="10" fill="url(#goodGrad)" stroke="#34D399" stroke-width="1.5"/>
    <rect x="15" y="12" width="370" height="24" rx="4" fill="#0E382B"/>
    <text x="25" y="28" fill="#34D399" font-family="Arial" font-size="11.5" font-weight="bold">PMB ATOMIC TREIBER STACK (sync/atomic CAS)</text>

    <!-- 3 Concurrent MicroVMs -->
    <g transform="translate(25, 55)">
      <rect width="120" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <text x="15" y="26" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="bold">MicroVM 1</text>

      <rect y="60" width="120" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <text x="15" y="86" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="bold">MicroVM 2</text>

      <rect y="120" width="120" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <text x="15" y="146" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="bold">MicroVM 3</text>
    </g>

    <!-- CAS Ingress Box -->
    <g transform="translate(180, 65)">
      <rect width="155" height="140" rx="8" fill="#0B2B20" stroke="#34D399" stroke-width="1.5"/>
      <text x="14" y="24" fill="#34D399" font-family="Arial" font-size="11" font-weight="bold">Lock-Free Treiber CAS</text>
      <text x="14" y="44" fill="#38BDF8" font-family="monospace" font-size="9.5">node.next = oldHead</text>
      <text x="14" y="62" fill="#38BDF8" font-family="monospace" font-size="9.5">CAS(&amp;head, old, node)</text>
      <rect x="10" y="78" width="135" height="50" rx="4" fill="#133D2F"/>
      <text x="16" y="96" fill="#FFFFFF" font-family="Arial" font-size="9.5" font-weight="bold">HARDWARE ATOMIC</text>
      <text x="16" y="112" fill="#34D399" font-family="Arial" font-size="9">Single CPU cycle swap</text>
      <text x="16" y="124" fill="#94A3B8" font-family="Arial" font-size="8.5">Zero kernel context switches</text>
    </g>

    <!-- Connecting Arrows into CAS -->
    <path d="M 145 76 L 175 105" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <path d="M 145 135 L 175 135" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <path d="M 145 196 L 175 165" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

    <!-- Lock-free Output -->
    <path d="M 335 135 L 365 135" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <g transform="translate(370, 85)">
      <rect width="130" height="100" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
      <text x="12" y="24" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="bold">Atomic Linked List</text>
      <text x="12" y="44" fill="#34D399" font-family="Arial" font-size="10" font-weight="bold">30,000+ ops/sec</text>
      <text x="12" y="64" fill="#38BDF8" font-family="Arial" font-size="9">O(1) Push Time</text>
      <text x="12" y="84" fill="#94A3B8" font-family="Arial" font-size="8.5">Flusher atomically</text>
      <text x="12" y="95" fill="#94A3B8" font-family="Arial" font-size="8.5">drains head to nil</text>
    </g>

    <!-- Bottom summary box -->
    <rect x="20" y="235" width="480" height="80" rx="6" fill="#0B1C16" stroke="#133D2D" stroke-width="1"/>
    <text x="32" y="258" fill="#34D399" font-family="Arial" font-size="10" font-weight="bold">PMB ADVANTAGE: INDEPENDENT CPU PROGRESS</text>
    <text x="32" y="278" fill="#94A3B8" font-family="Arial" font-size="9.5">Producers never sleep. If a collision occurs, CPU retries the 2-cycle CAS</text>
    <text x="32" y="295" fill="#94A3B8" font-family="Arial" font-size="9.5">immediately. Scales perfectly across 50+ concurrent microVM streams.</text>
  </g>
</svg>