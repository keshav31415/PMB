<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="100%" height="100%">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818CF8"/>
    </marker>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#141E2E"/>
    </linearGradient>
    <linearGradient id="pmbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162D4A"/>
      <stop offset="100%" stop-color="#0E1D30"/>
    </linearGradient>
    <linearGradient id="nvmeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13362A"/>
      <stop offset="100%" stop-color="#0B2119"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="600" fill="#131B2B"/>

  <!-- Outer Boundary: Hypervisor Host Platform -->
  <rect x="20" y="20" width="1060" height="560" rx="12" fill="#0C1422" stroke="#253A5A" stroke-width="2"/>
  <rect x="35" y="10" width="480" height="24" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="50" y="26" fill="#38BDF8" font-family="Arial" font-size="12" font-weight="bold" letter-spacing="1">HOST HYPERVISOR PLATFORM (Nutanix AHV / Linux KVM / Firecracker)</text>

  <!-- Guest MicroVM #1 (Left) -->
  <g transform="translate(45, 70)">
    <rect width="260" height="340" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="2"/>
    <rect x="15" y="15" width="230" height="30" rx="6" fill="#261E42"/>
    <text x="25" y="35" fill="#C4B5FD" font-family="Arial" font-size="13" font-weight="bold">GUEST MICROVM #1 (INGRESS)</text>
    <text x="25" y="70" fill="#FFFFFF" font-family="Arial" font-size="14" font-weight="bold">Telemetry Producer</text>
    <text x="25" y="90" fill="#94A3B8" font-family="Arial" font-size="11">Edge Ingestion Daemon</text>

    <rect x="20" y="120" width="220" height="90" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="32" y="145" fill="#38BDF8" font-family="Arial" font-size="11" font-weight="bold">Zero-SDK TCP Socket</text>
    <text x="32" y="168" fill="#FFFFFF" font-family="Arial" font-size="11">Standard POSIX socket write</text>
    <text x="32" y="188" fill="#94A3B8" font-family="monospace" font-size="11">PUB orders {"id":101}</text>

    <rect x="20" y="230" width="220" height="85" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="32" y="255" fill="#FBBF24" font-family="Arial" font-size="11" font-weight="bold">Hardware Isolation</text>
    <text x="32" y="278" fill="#94A3B8" font-family="Arial" font-size="11">• No shared host memory</text>
    <text x="32" y="296" fill="#94A3B8" font-family="Arial" font-size="11">• Isolated guest user-space</text>
  </g>

  <!-- Center: PMB Broker Engine -->
  <g transform="translate(360, 60)">
    <rect width="380" height="490" rx="10" fill="url(#pmbGrad)" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="20" y="15" width="340" height="32" rx="6" fill="#132F52"/>
    <text x="35" y="36" fill="#38BDF8" font-family="Arial" font-size="13" font-weight="bold">PMB BROKER PROCESS (:4222) - NATIVE GO</text>
    
    <!-- Box 1: TCP Server Ingress -->
    <rect x="25" y="65" width="330" height="65" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="40" y="90" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">1. TCP Ingress (:4222)</text>
    <text x="40" y="112" fill="#94A3B8" font-family="Arial" font-size="11">Non-blocking net.Conn reader • 1MB input buffer</text>

    <!-- Arrow down -->
    <path d="M 190 130 L 190 155" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

    <!-- Box 2: Lock-Free Atomic Treiber Stack -->
    <rect x="25" y="160" width="330" height="75" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="40" y="185" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">2. Lock-Free Atomic Queue</text>
    <text x="40" y="206" fill="#34D399" font-family="Arial" font-size="11" font-weight="bold">sync/atomic CAS Ingress (No Mutex)</text>
    <text x="40" y="224" fill="#94A3B8" font-family="Arial" font-size="11">Zero lock contention across 50+ microVM producers</text>

    <!-- Arrow down -->
    <path d="M 190 235 L 190 260" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

    <!-- Box 3: Dynamic Group Commit -->
    <rect x="25" y="265" width="330" height="75" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="40" y="290" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">3. Dynamic Group Commit Coordinator</text>
    <text x="40" y="311" fill="#FBBF24" font-family="Arial" font-size="11" font-weight="bold">Leader/Follower Batching Barrier</text>
    <text x="40" y="329" fill="#94A3B8" font-family="Arial" font-size="11">Coalesces N incoming writes into 1 hardware fsync()</text>

    <!-- Arrow down -->
    <path d="M 190 340 L 190 365" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

    <!-- Box 4: Routing Table & pendingAcks -->
    <rect x="25" y="370" width="330" height="75" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="40" y="395" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">4. Thread-Safe Route Table</text>
    <text x="40" y="416" fill="#818CF8" font-family="Arial" font-size="11" font-weight="bold">pendingAcks Map &amp; 2-Second Retransmit</text>
    <text x="40" y="434" fill="#94A3B8" font-family="Arial" font-size="11">Immediate offset truncation upon subscriber ACK</text>

    <!-- Footer specs chip -->
    <rect x="25" y="455" width="330" height="22" rx="4" fill="#0C1B2E"/>
    <text x="45" y="470" fill="#38BDF8" font-family="Arial" font-size="10.5" font-weight="bold">BINARY: 3.78 MB  |  IDLE RESIDENT RAM: 7.18 MB</text>
  </g>

  <!-- Guest MicroVM #2 (Right Top) -->
  <g transform="translate(790, 70)">
    <rect width="265" height="210" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="2"/>
    <rect x="15" y="15" width="235" height="30" rx="6" fill="#261E42"/>
    <text x="25" y="35" fill="#C4B5FD" font-family="Arial" font-size="13" font-weight="bold">GUEST MICROVM #2 (EGRESS)</text>
    
    <text x="25" y="70" fill="#FFFFFF" font-family="Arial" font-size="14" font-weight="bold">Subscriber Worker</text>
    <text x="25" y="90" fill="#94A3B8" font-family="Arial" font-size="11">Idempotent Event Consumer</text>

    <rect x="20" y="110" width="225" height="85" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="32" y="132" fill="#34D399" font-family="Arial" font-size="11" font-weight="bold">At-Least-Once Delivery</text>
    <text x="32" y="152" fill="#FFFFFF" font-family="monospace" font-size="11">MSG orders 1 {"id":101}</text>
    <text x="32" y="172" fill="#94A3B8" font-family="monospace" font-size="11">ACK orders 1</text>
  </g>

  <!-- Physical Storage Subsystem (Right Bottom) -->
  <g transform="translate(790, 310)">
    <rect width="265" height="240" rx="10" fill="url(#nvmeGrad)" stroke="#34D399" stroke-width="2"/>
    <rect x="15" y="15" width="235" height="30" rx="6" fill="#133D2D"/>
    <text x="25" y="35" fill="#34D399" font-family="Arial" font-size="13" font-weight="bold">PHYSICAL STORAGE SUBSYSTEM</text>

    <text x="25" y="70" fill="#FFFFFF" font-family="Arial" font-size="14" font-weight="bold">Hardware NVMe / SSD</text>
    <text x="25" y="90" fill="#34D399" font-family="Arial" font-size="11" font-weight="bold">Direct Kernel os.File.Sync()</text>

    <rect x="20" y="110" width="225" height="110" rx="6" fill="#0B1A14" stroke="#1F4D3B" stroke-width="1"/>
    <text x="32" y="132" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="bold">Sequential Append-Only WAL</text>
    <text x="32" y="154" fill="#94A3B8" font-family="monospace" font-size="10.5">data/logs/&lt;topic&gt;.log</text>
    <text x="32" y="180" fill="#FBBF24" font-family="Arial" font-size="10.5" font-weight="bold">Zero Host Buffer Cache Delay</text>
    <text x="32" y="198" fill="#94A3B8" font-family="Arial" font-size="10.5">Survives sudden AHV power drops</text>
  </g>

  <!-- Connectors -->
  <!-- 1. PUB stream from VM1 to PMB -->
  <path d="M 305 210 L 350 210" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <rect x="290" y="188" width="80" height="20" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="296" y="202" fill="#38BDF8" font-family="Arial" font-size="10" font-weight="bold">1. TCP PUB</text>

  <!-- 2. fsync to NVMe -->
  <path d="M 740 330 L 780 370" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>
  <rect x="710" y="340" width="95" height="20" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
  <text x="716" y="354" fill="#34D399" font-family="Arial" font-size="10" font-weight="bold">2. Hard f.Sync()</text>

  <!-- 3. MSG dispatch to VM2 -->
  <path d="M 740 400 L 770 400 L 770 200 L 780 200" stroke="#818CF8" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="705" y="260" width="100" height="20" rx="4" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
  <text x="711" y="274" fill="#818CF8" font-family="Arial" font-size="10" font-weight="bold">3. Guaranteed MSG</text>

  <!-- 4. ACK back to PMB -->
  <path d="M 790 230 L 750 230" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-cyan)"/>
  <rect x="720" y="215" width="70" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="726" y="228" fill="#38BDF8" font-family="Arial" font-size="9.5" font-weight="bold">4. Stream ACK</text>
</svg>