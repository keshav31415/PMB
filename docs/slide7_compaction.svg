<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <marker id="arrow-down-red" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#F87171"/>
    </marker>
    <marker id="arrow-down-green" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#34D399"/>
    </marker>
    <linearGradient id="compBad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261219"/>
      <stop offset="100%" stop-color="#14090D"/>
    </linearGradient>
    <linearGradient id="compGood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F241C"/>
      <stop offset="100%" stop-color="#071410"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="360" fill="#131B2B"/>

  <!-- LEFT: Kafka/Enterprise Static Retention -->
  <g transform="translate(20, 15)">
    <rect width="520" height="330" rx="10" fill="url(#compBad)" stroke="#F87171" stroke-width="1.5"/>
    <rect x="15" y="12" width="360" height="24" rx="4" fill="#4A181D"/>
    <text x="25" y="28" fill="#FCA5A5" font-family="Arial" font-size="11.5" font-weight="bold">TRADITIONAL BROKERS: STATIC TIME RETENTION</text>

    <!-- Log Accumulation Stack -->
    <g transform="translate(25, 50)">
      <rect width="470" height="34" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="15" y="22" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="bold">Day 1: Segment 0000000000.log</text>
      <text x="350" y="22" fill="#94A3B8" font-family="monospace" font-size="10">500 MB RAM/Disk</text>

      <rect y="42" width="470" height="34" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="15" y="64" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="bold">Day 2: Segment 0000000500.log</text>
      <text x="350" y="64" fill="#94A3B8" font-family="monospace" font-size="10">500 MB RAM/Disk</text>

      <rect y="84" width="470" height="34" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="15" y="106" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="bold">Day 3: Segment 0000001000.log</text>
      <text x="350" y="106" fill="#94A3B8" font-family="monospace" font-size="10">500 MB RAM/Disk</text>

      <rect y="126" width="470" height="34" rx="4" fill="#3D1217" stroke="#F87171" stroke-width="1"/>
      <text x="15" y="148" fill="#FCA5A5" font-family="Arial" font-size="10.5" font-weight="bold">Day 7: Cumulative Static Accumulation</text>
      <text x="350" y="148" fill="#FCA5A5" font-family="monospace" font-size="10" font-weight="bold">3.5 GB Accumulation</text>
    </g>

    <!-- Arrow down to disaster -->
    <path d="M 260 215 L 260 230" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-down-red)"/>

    <!-- Failure Box -->
    <rect x="25" y="235" width="470" height="80" rx="6" fill="#450F15" stroke="#F87171" stroke-width="1.5"/>
    <text x="40" y="258" fill="#FCA5A5" font-family="Arial" font-size="11" font-weight="bold">CRITICAL OUTCOME: /var ROOT PARTITION RUNS OUT</text>
    <text x="40" y="278" fill="#FFFFFF" font-family="Arial" font-size="9.5">Hypervisor hosts reserve limited root flash (e.g. 8-16 GB).</text>
    <text x="40" y="295" fill="#94A3B8" font-family="Arial" font-size="9.5">Retaining already-acknowledged messages triggers host read-only lockouts.</text>
  </g>

  <!-- RIGHT: PMB Active Compaction Engine -->
  <g transform="translate(560, 15)">
    <rect width="520" height="330" rx="10" fill="url(#compGood)" stroke="#34D399" stroke-width="1.5"/>
    <rect x="15" y="12" width="370" height="24" rx="4" fill="#0E382A"/>
    <text x="25" y="28" fill="#34D399" font-family="Arial" font-size="11.5" font-weight="bold">PMB ACTIVE RECLAMATION: ZERO STORAGE LEAKS</text>

    <!-- Compaction Steps -->
    <g transform="translate(25, 50)">
      <!-- Step 1 -->
      <rect width="470" height="48" rx="6" fill="#162E25" stroke="#34D399" stroke-width="1"/>
      <text x="15" y="22" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="bold">Step 1: Write to Append-Only Active WAL</text>
      <text x="15" y="38" fill="#94A3B8" font-family="Arial" font-size="9.5">Incoming events commit sequential NVMe blocks (&lt;topic&gt;.log)</text>

      <!-- Step 2 -->
      <rect y="56" width="470" height="48" rx="6" fill="#162E25" stroke="#34D399" stroke-width="1"/>
      <text x="15" y="78" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="bold">Step 2: Microsecond Subscriber ACK Trigger</text>
      <text x="15" y="94" fill="#38BDF8" font-family="Arial" font-size="9.5">All registered subscribers confirm delivery; offset confirmed clean</text>

      <!-- Step 3 -->
      <rect y="112" width="470" height="48" rx="6" fill="#162E25" stroke="#34D399" stroke-width="1"/>
      <text x="15" y="134" fill="#34D399" font-family="Arial" font-size="10.5" font-weight="bold">Step 3: Instant OS Truncation to 0 Bytes</text>
      <text x="15" y="150" fill="#FFFFFF" font-family="monospace" font-size="9.5">os.Truncate(walPath, 0) via atomic rewrite</text>
    </g>

    <!-- Arrow down to success -->
    <path d="M 260 215 L 260 230" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-down-green)"/>

    <!-- Outcome Box -->
    <rect x="25" y="235" width="470" height="80" rx="6" fill="#0B261D" stroke="#34D399" stroke-width="1.5"/>
    <text x="40" y="258" fill="#34D399" font-family="Arial" font-size="11" font-weight="bold">STEADY-STATE DISK FOOTPRINT: &lt; 100 MB INDEFINITELY</text>
    <text x="40" y="278" fill="#FFFFFF" font-family="Arial" font-size="9.5">No cron jobs, no background segment compaction stalls.</text>
    <text x="40" y="295" fill="#94A3B8" font-family="Arial" font-size="9.5">Physical disk blocks are reclaimed the exact microsecond work is done.</text>
  </g>
</svg>