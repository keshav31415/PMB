<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F87171"/>
    </marker>
    <linearGradient id="routeAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D151E"/>
      <stop offset="100%" stop-color="#190C12"/>
    </linearGradient>
    <linearGradient id="routeBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1A15"/>
      <stop offset="100%" stop-color="#1A0D0A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="360" fill="#131B2B"/>

  <!-- ================= PIPELINE A ================= -->
  <g transform="translate(20, 15)">
    <!-- Container -->
    <rect width="1060" height="150" rx="10" fill="url(#routeAGrad)" stroke="#F87171" stroke-width="1.5"/>
    <rect x="15" y="10" width="460" height="24" rx="4" fill="#4C1D24"/>
    <text x="25" y="26" fill="#FCA5A5" font-family="Arial" font-size="11.5" font-weight="bold">ROUTE A: HEAVY ENTERPRISE BROKERS (Kafka, RabbitMQ, ActiveMQ)</text>

    <!-- Step 1: Producer -->
    <g transform="translate(25, 45)">
      <rect width="160" height="85" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="15" y="25" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">MicroVM Ingress</text>
      <text x="15" y="45" fill="#94A3B8" font-family="Arial" font-size="10.5">Heavy Client SDK</text>
      <text x="15" y="65" fill="#94A3B8" font-family="Arial" font-size="10">Thick client libraries</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 190 88 L 220 88" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Step 2: Runtime Bloat -->
    <g transform="translate(225, 45)">
      <rect width="185" height="85" rx="6" fill="#1E293B" stroke="#F87171" stroke-width="1.2"/>
      <text x="12" y="25" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">JVM / BEAM Runtime</text>
      <text x="12" y="45" fill="#FCA5A5" font-family="Arial" font-size="10.5" font-weight="bold">500MB – 1.5GB Idle RAM</text>
      <text x="12" y="65" fill="#94A3B8" font-family="Arial" font-size="10">Exceeds edge memory cap</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 415 88 L 445 88" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Step 3: Quorum Election -->
    <g transform="translate(450, 45)">
      <rect width="185" height="85" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="12" y="25" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">Cluster Quorum</text>
      <text x="12" y="45" fill="#FDE68A" font-family="Arial" font-size="10.5">ZooKeeper / KRaft</text>
      <text x="12" y="65" fill="#94A3B8" font-family="Arial" font-size="10">15–45s boot delay</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 640 88 L 670 88" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Step 4: Static Retention -->
    <g transform="translate(675, 45)">
      <rect width="180" height="85" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="12" y="25" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">Static Retention</text>
      <text x="12" y="45" fill="#FDE68A" font-family="Arial" font-size="10.5">7-Day Log Segments</text>
      <text x="12" y="65" fill="#94A3B8" font-family="Arial" font-size="10">Fills /var root disk</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M 860 88 L 890 88" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Step 5: Failure Outcome -->
    <g transform="translate(895, 45)">
      <rect width="145" height="85" rx="6" fill="#58151C" stroke="#F87171" stroke-width="1.5"/>
      <text x="12" y="25" fill="#FCA5A5" font-family="Arial" font-size="12" font-weight="bold">CRITICAL FAIL</text>
      <text x="12" y="45" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="bold">Host OOM Panic</text>
      <text x="12" y="65" fill="#FCA5A5" font-family="Arial" font-size="10">&amp; Disk Exhaustion</text>
    </g>
  </g>

  <!-- ================= PIPELINE B ================= -->
  <g transform="translate(20, 185)">
    <!-- Container -->
    <rect width="1060" height="150" rx="10" fill="url(#routeBGrad)" stroke="#FBBF24" stroke-width="1.5"/>
    <rect x="15" y="10" width="460" height="24" rx="4" fill="#4A2612"/>
    <text x="25" y="26" fill="#FDE68A" font-family="Arial" font-size="11.5" font-weight="bold">ROUTE B: EPHEMERAL IN-MEMORY IPC (Redis Pub/Sub, ZeroMQ, Nanomsg)</text>

    <!-- Step 1: Producer -->
    <g transform="translate(25, 45)">
      <rect width="160" height="85" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="15" y="25" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">MicroVM Ingress</text>
      <text x="15" y="45" fill="#94A3B8" font-family="Arial" font-size="10.5">Raw POSIX Socket</text>
      <text x="15" y="65" fill="#94A3B8" font-family="Arial" font-size="10">Fast socket write</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 190 88 L 220 88" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Step 2: Volatile Buffer -->
    <g transform="translate(225, 45)">
      <rect width="185" height="85" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="12" y="25" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">User-Space Ring Buffer</text>
      <text x="12" y="45" fill="#FDE68A" font-family="Arial" font-size="10.5">Ephemeral Memory</text>
      <text x="12" y="65" fill="#94A3B8" font-family="Arial" font-size="10">High throughput, 0 disk</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 415 88 L 445 88" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Step 3: Unsynchronized RAM Heap -->
    <g transform="translate(450, 45)">
      <rect width="185" height="85" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="12" y="25" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="bold">Unsynchronized Heap</text>
      <text x="12" y="45" fill="#FCA5A5" font-family="Arial" font-size="10.5">No fsync() Barrier</text>
      <text x="12" y="65" fill="#94A3B8" font-family="Arial" font-size="10">Bytes sit in dirty pages</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 640 88 L 670 88" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Step 4: Host Crash Event -->
    <g transform="translate(675, 45)">
      <rect width="180" height="85" rx="6" fill="#3D1A1A" stroke="#F87171" stroke-width="1.2"/>
      <text x="12" y="25" fill="#FDE68A" font-family="Arial" font-size="12" font-weight="bold">⚡ Sudden Power Cut</text>
      <text x="12" y="45" fill="#FCA5A5" font-family="Arial" font-size="10.5" font-weight="bold">Host Panic / Reboot</text>
      <text x="12" y="65" fill="#94A3B8" font-family="Arial" font-size="10">Hypervisor node drop</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M 860 88 L 890 88" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Step 5: Failure Outcome -->
    <g transform="translate(895, 45)">
      <rect width="145" height="85" rx="6" fill="#58151C" stroke="#F87171" stroke-width="1.5"/>
      <text x="12" y="25" fill="#FCA5A5" font-family="Arial" font-size="12" font-weight="bold">CRITICAL FAIL</text>
      <text x="12" y="45" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="bold">100% In-Flight Loss</text>
      <text x="12" y="65" fill="#FCA5A5" font-family="Arial" font-size="10">Zero Data Recovery</text>
    </g>
  </g>
</svg>